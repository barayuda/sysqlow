services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sysqlow
      POSTGRES_USER: sysqlow
      POSTGRES_PASSWORD: sysqlow
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  ollama-data:
